name: CI

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RazorLight.sln

      - name: Build
        run: dotnet build RazorLight.sln --configuration Release --no-restore --warnaserror

      - name: Verify formatting
        run: |
          dotnet format RazorLight.sln whitespace --no-restore --verify-no-changes
          dotnet format RazorLight.sln style --no-restore --verify-no-changes --diagnostics IDE0005 IDE0065

      - name: Test RazorLight
        run: dotnet test tests/RazorLight.Tests/RazorLight.Tests.csproj --framework net10.0 --configuration Release --no-build --collect:"XPlat Code Coverage;Format=cobertura" --results-directory artifacts/TestResults/RazorLight --logger "console;verbosity=normal"

      - name: Test precompile tool
        run: dotnet test tests/RazorLight.Precompile.Tests/RazorLight.Precompile.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage;Format=cobertura" --results-directory artifacts/TestResults/Precompile --logger "console;verbosity=normal"

      - name: Test deployment modes
        if: matrix.os != 'macos-latest'
        shell: pwsh
        run: ./scripts/Test-DeploymentModes.ps1

      - name: Verify trimming and Native AOT diagnostics
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./scripts/Test-DeploymentDiagnostics.ps1

      - name: Restore repository tools
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool restore

      - name: Verify deterministic build outputs
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./scripts/Test-DeterministicBuild.ps1

      - name: Pack and validate release-candidate artifacts
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/RazorLight/RazorLight.csproj --configuration Release --no-build --output artifacts/packages --warnaserror
          dotnet pack src/RazorLight.Html/RazorLight.Html.csproj --configuration Release --no-build --output artifacts/packages --warnaserror
          dotnet pack src/RazorLight.Precompile/RazorLight.Precompile.csproj --configuration Release --no-build --output artifacts/packages --warnaserror

      - name: Validate package layout and Source Link metadata
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $version = (& dotnet msbuild src/RazorLight/RazorLight.csproj -getProperty:VersionPrefix).Trim()
          ./scripts/Validate-Packages.ps1 -PackageDirectory artifacts/packages -Version $version

      - name: Resolve Source Link documents
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet sourcelink test src/RazorLight/bin/Release/net10.0/RazorLight.pdb
          dotnet sourcelink test src/RazorLight.Html/bin/Release/net10.0/RazorLight.Html.pdb
          dotnet sourcelink test src/RazorLight.Precompile/bin/Release/net10.0/RazorLight.Precompile.pdb

      - name: Upload release-candidate packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

      - name: Run Entity Framework sample
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project samples/RazorLight.Samples/Samples.EntityFrameworkProject.csproj --configuration Release --no-build

      - name: Build Azure Functions sample
        if: matrix.os == 'ubuntu-latest'
        run: dotnet build samples/FunctionApp-WebMvc-Sample/FunctionApp-WebMvc-Sample/FunctionApp-WebMvc-Sample.csproj --configuration Release --warnaserror

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: artifacts/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
